name: week07-cache-scaling
x-python: &python
  image: week07-cache-lab:local
  init: true
  restart: unless-stopped
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server","--save","","--appendonly","no","--maxmemory","64mb","--maxmemory-policy","allkeys-lru"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 3s
      timeout: 2s
      retries: 15
    mem_limit: 128m
  app:
    <<: *python
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
    deploy:
      replicas: 2
      resources:
        reservations: {cpus: "0.20", memory: 32M}
        limits: {cpus: "0.50", memory: 128M}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 4s
      timeout: 3s
      retries: 12
  gateway:
    <<: *python
    command: ["python","-m","app.gateway"]
    environment:
      WORKER_DNS: app
    ports: ["127.0.0.1:8087:8087"]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15
