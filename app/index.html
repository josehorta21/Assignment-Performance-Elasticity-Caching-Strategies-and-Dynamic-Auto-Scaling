<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Cache & capacity lab</title>
<style>
:root{font:16px/1.5 Inter,system-ui,sans-serif;color:#182e38;background:#f5f5ef}
*{box-sizing:border-box}main{max-width:960px;margin:0 auto;padding:clamp(18px,5vw,52px)}h1{font-size:clamp(2.5rem,7vw,4.5rem);line-height:1.05;letter-spacing:-.065em;margin:0 0 1.5rem}h2{font-size:1.3rem}
section{border-top:2px solid #214758;padding:12px 0 20px}.metrics{display:flex;gap:2rem;flex-wrap:wrap}small{display:block;color:#53666c}.metrics b{font-size:2rem;color:#086858}
input,button{font:inherit;padding:.48rem .7rem;border:1px solid #879b9d;border-radius:4px}button{color:#fff;background:#126455;cursor:pointer;border-color:#126455}
form{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}output{display:block;margin:12px 0;font:1rem/1.5 ui-monospace,monospace;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:.94rem}td,th{text-align:left;border-bottom:1px solid #cbd4ce;padding:7px 4px}th{color:#516768}.table{overflow:auto}
</style></head><body><main><h1>Cache &amp; capacity lab</h1><section><h2>Report lookup</h2><form><label for="key">Report ID</label><input id="key" required pattern="[A-Za-z0-9_\-]{1,80}" value="checkout-01"><button>Fetch report</button></form><output id="result" aria-live="polite">Fetch the same ID twice to compare responses.</output></section>
<section><h2>Live fleet</h2><div class="metrics"><div><small>Ready workers</small><b id="ready">—</b></div><div><small>CPU / requested CPU</small><b id="cpu">—</b></div><div><small>Seconds in cooldown</small><b id="hold">—</b></div></div><p id="reason">Connecting…</p><div class="table"><table><thead><tr><th>UTC</th><th>Ready</th><th>CPU</th><th>Policy observation</th></tr></thead><tbody></tbody></table></div></section></main>
<script>
const el=id=>document.getElementById(id);
document.querySelector('form').onsubmit=async e=>{
 e.preventDefault();const start=performance.now();
 try{const r=await fetch('/api/data/'+encodeURIComponent(el('key').value),{cache:'no-store'});await r.text();
 el('result').textContent=[r.status,r.headers.get('X-Cache'),(performance.now()-start).toFixed(1)+' ms',r.headers.get('X-Replica')].filter(Boolean).join('  ·  ');}
 catch(e){el('result').textContent=e.message;}
};
const pct=x=>x==null?'—':x.toFixed(1)+'%';
async function poll(){
 try{const r=await fetch('/status',{cache:'no-store'});const data=await r.json();el('ready').textContent=data.ready;el('cpu').textContent=pct(data.cpu);el('hold').textContent=data.hold_seconds??"—";el('reason').textContent=data.reason;
 const body=document.querySelector('tbody');body.replaceChildren();for(const row of data.history.slice(-12).reverse()){const tr=body.insertRow();for(const v of [row.time,row.ready,pct(row.cpu),row.reason])tr.insertCell().textContent=v;}}
 catch(e){el('reason').textContent='Gateway unavailable';}
 finally{setTimeout(poll,2000);}
}poll();
</script></body></html>
